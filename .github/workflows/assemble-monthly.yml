name: assemble-monthly
on:
  push:
    paths:
      - ".github/workflows/assemble-monthly.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore deck files
        env:
          MONTHLY_URL: https://litter.catbox.moe/1mztx0.txt
          INDEX_URL: https://litter.catbox.moe/ejriu5.txt
        run: |
          set -euo pipefail
          curl -fsSL "$MONTHLY_URL" -o monthly.json
          curl -fsSL "$INDEX_URL" -o index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          checks = {
            "monthly.json": (197270, "0a3ab3afa6d161be33f7fa108ad069065e436bdeaf50bd5e6437ad0bc7891141"),
            "index.html": (24755, "7b15502a65bba8c53f0261d14f4ceb5af324509fa971a9628e9feaea62132058"),
          }
          for path, (n, expect) in checks.items():
            c = Path(path).read_text()
            if path.endswith(".json"):
              json.loads(c)
            h = hashlib.sha256(c.encode()).hexdigest()
            print(path, "len", len(c), "sha256", h)
            assert len(c) == n and h == expect
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly.json index.html
          if git diff --cached --quiet; then
            echo "deck files already up to date"
          else
            git commit -m "deck: restore index.html + monthly.json (verified mirrors)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
