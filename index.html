<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presença jan–set/2026 · Reunião</title>
<style>
  :root {
    --ink: #101820;
    --muted: #667787;
    --line: #e4e0d8;
    --bg: #efece6;
    --paper: #fffcf7;
    --br: #0b6b57;
    --ig: #1a3d66;
    --up: #157a45;
    --upbg: #dff5e8;
    --down: #b13a3a;
    --downbg: #fdeaea;
    --gold: #c96b2c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(16,24,32,.92);
    color: #fff;
    backdrop-filter: blur(8px);
  }
  .topbar .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav button, .tool button {
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.08);
    color: #fff;
    border-radius: 999px;
    padding: 7px 12px;
    font: 600 12px/1 system-ui, sans-serif;
    cursor: pointer;
  }
  .nav button.active { background: #fff; color: var(--ink); }
  .tool { display: flex; gap: 6px; }
  main { flex: 1; padding: 18px 18px 40px; max-width: 1200px; width: 100%; margin: 0 auto; }

  .slide { display: none; animation: in .25s ease; }
  .slide.active { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

  .hero {
    background: linear-gradient(145deg, #102030, #0b6b57 55%, #1a3d66);
    color: #fff;
    border-radius: 24px;
    padding: clamp(22px, 4vw, 40px);
    min-height: 70vh;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow { font: 600 12px/1.2 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .7; margin: 0 0 14px; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; font-weight: 700; }
  .lead { font-size: clamp(1rem, 2vw, 1.25rem); max-width: 36em; opacity: .92; margin: 0 0 28px; }
  .big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .big {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;
    padding: 18px 20px;
  }
  .big .u { font: 700 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .big .n { font-size: clamp(2.6rem, 7vw, 4.5rem); font-weight: 700; line-height: 1; margin: 8px 0; }
  .big .s { font: 500 14px/1.35 system-ui, sans-serif; opacity: .85; }

  h2 {
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    margin: 0 0 8px;
  }
  .sub { margin: 0 0 18px; color: var(--muted); font: 500 15px/1.4 system-ui, sans-serif; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
  }
  .card.br { border-top: 5px solid var(--br); }
  .card.ig { border-top: 5px solid var(--ig); }
  .card h3 { margin: 0 0 12px; font-size: 1.3rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .tag { font: 700 11px system-ui, sans-serif; padding: 4px 9px; border-radius: 999px; background: #ece7dc; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #f5f1e8; border-radius: 12px; padding: 10px; }
  .kpi .l { font: 600 10px system-ui, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .kpi .v { font-size: 1.6rem; font-weight: 700; margin-top: 2px; }
  .kpi .v.gold { color: var(--gold); }
  .rows { display: grid; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 1.3fr .7fr .8fr .8fr;
    gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 10px; background: #f7f3ea;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  .row.head { background: transparent; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 12px; font: 650 12px system-ui, sans-serif; cursor: pointer;
  }
  .filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .tablebox {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: auto;
    max-height: calc(100vh - 220px);
  }
  table { width: 100%; border-collapse: collapse; font: 500 13px/1.25 system-ui, sans-serif; min-width: 700px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eee7da; text-align: left; }
  th { position: sticky; top: 0; background: #152433; color: #fff; z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:nth-child(even) td { background: #fbf8f1; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font: 700 11px system-ui, sans-serif; }
  .badge.acima { background: var(--upbg); color: var(--up); }
  .badge.abaixo { background: var(--downbg); color: var(--down); }

  .hint {
    margin-top: 12px; color: var(--muted);
    font: 500 12px/1.4 system-ui, sans-serif;
  }

  @media (max-width: 800px) {
    .big-row, .cards, .kpis { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr 1fr; }
  }
  @media print {
    .topbar { display: none; }
    .slide { display: block !important; page-break-after: always; }
    .tablebox { max-height: none; overflow: visible; }
    body { background: #fff; }
  }

  .month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .spark {
    display: flex; align-items: flex-end; gap: 6px;
    height: 120px; margin: 8px 0 14px; padding: 0 2px;
  }
  .spark .bar-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%;
    justify-content: flex-end;
  }
  .spark .bar {
    width: 100%; border-radius: 6px 6px 2px 2px; min-height: 4px;
    background: linear-gradient(180deg, #2a9d7a, #0b6b57);
  }
  .spark .bar.ig { background: linear-gradient(180deg, #3a6ea5, #1a3d66); }
  .spark .bl { font: 700 10px system-ui, sans-serif; color: var(--muted); }
  .spark .bv { font: 700 11px system-ui, sans-serif; }
  .month-table { width: 100%; border-collapse: collapse; font: 500 13px/1.25 system-ui, sans-serif; }
  .month-table th, .month-table td { padding: 8px 10px; border-bottom: 1px solid #eee7da; text-align: right; }
  .month-table th:first-child, .month-table td:first-child { text-align: left; }
  .month-table th { background: #f5f1e8; color: var(--muted); font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; }
  .month-table td.up { color: var(--up); font-weight: 700; }
  .opiniao {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(18px, 3vw, 28px);
  }
  .opiniao h2 { margin-bottom: 4px; }
  .opiniao .points { display: grid; gap: 14px; margin-top: 18px; }
  .opiniao .point {
    display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start;
    padding: 14px 16px; border-radius: 14px; background: #f7f3ea;
  }
  .opiniao .num {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font: 700 16px Georgia, serif; color: #fff;
    background: linear-gradient(145deg, #0b6b57, #1a3d66);
  }
  .opiniao .point h4 { margin: 0 0 4px; font: 700 15px/1.25 system-ui, sans-serif; }
  .opiniao .point p { margin: 0; color: #3a4654; font: 500 14px/1.45 system-ui, sans-serif; }
  .callout {
    margin-top: 18px; padding: 16px 18px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(11,107,87,.1), rgba(26,61,102,.1));
    border-left: 4px solid var(--br);
    font: 500 15px/1.45 system-ui, sans-serif;
  }

  .month-pros { margin-top: 16px; display: grid; gap: 12px; }
  .month-pros details {
    background: #f7f3ea; border: 1px solid var(--line); border-radius: 14px; padding: 0;
  }
  .month-pros summary {
    cursor: pointer; list-style: none; padding: 12px 14px;
    font: 700 13px/1.3 system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  }
  .month-pros summary::-webkit-details-marker { display: none; }
  .month-pros summary::before {
    content: "▸"; color: var(--muted); margin-right: 4px;
  }
  .month-pros details[open] summary::before { content: "▾"; }
  .month-pros .meta { font: 600 12px system-ui, sans-serif; color: var(--muted); }
  .month-pros .tablebox { max-height: 320px; border: none; border-radius: 0 0 14px 14px; }
  .month-pros table { min-width: 560px; }
  .cat-pill {
    font: 700 10px system-ui, sans-serif; padding: 2px 7px; border-radius: 999px;
    background: #ece7dc; color: var(--ink);
  }
  .cat-pill.cab { background: #dceee8; }
  .cat-pill.man { background: #e8e4f5; }
  .cat-pill.maq { background: #f5e8dc; }
  @media (max-width: 800px) {
    .month-grid { grid-template-columns: 1fr; }
  }

</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">ROM · Presença Jan–Set/2026</div>
    <div class="nav" id="nav"></div>
    <div class="tool">
      <button onclick="prev()">←</button>
      <button onclick="next()">→</button>
      <button onclick="window.print()">PDF</button>
    </div>
  </div>
  <main id="deck"></main>
</div>

<script id="DATA" type="application/json">{}</script>
<script>
(async () => {
  const [meta, brasil, iguatemi, monthly] = await Promise.all([
    fetch('./meta.json').then(r => { if (!r.ok) throw new Error('meta '+r.status); return r.json(); }),
    fetch('./brasil.json').then(r => { if (!r.ok) throw new Error('brasil '+r.status); return r.json(); }),
    fetch('./iguatemi.json').then(r => { if (!r.ok) throw new Error('iguatemi '+r.status); return r.json(); }),
    fetch('./monthly.json').then(r => { if (!r.ok) throw new Error('monthly '+r.status); return r.json(); }),
  ]);
  const payload = { ...meta, unidades: { brasil, iguatemi }, monthly };
  document.getElementById('DATA').textContent = JSON.stringify(payload);

const DATA = JSON.parse(document.getElementById('DATA').textContent);
const CATS = ['Cabeleireiros','Manicure','Maquiadora'];
const br = DATA.unidades.brasil, ig = DATA.unidades.iguatemi;
const mBr = DATA.monthly.brasil, mIg = DATA.monthly.iguatemi;

const money = n => n == null ? '—' : Number(n).toLocaleString('pt-BR', {maximumFractionDigits:0});
const pct = n => n == null ? '—' : String(n).replace('.', ',') + '%';
const delta = n => n == null ? '—' : ((n>0?'+':'') + Number(n).toFixed(1).replace('.', ','));
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function unitBlock(u, cls){
  const rows = CATS.map(c => {
    const b = u.by_category[c];
    return `<div class="row"><strong>${c}</strong><span>${b.n}</span><span>${pct(b.media_constancia_pct)}</span><span>${b.media_dias_trabalhados} d</span></div>`;
  }).join('');
  return `<article class="card ${cls}">
    <h3>${esc(u.unidade)} <span class="tag">${u.salon_open_days} dias abertos</span></h3>
    <div class="kpis">
      <div class="kpi"><div class="l">Constância</div><div class="v gold">${pct(u.media_geral_constancia_pct)}</div></div>
      <div class="kpi"><div class="l">Média dias</div><div class="v">${u.media_dias_trabalhados}</div></div>
      <div class="kpi"><div class="l">Com presença</div><div class="v">${u.n_com_presenca}</div></div>
    </div>
    <div class="rows">
      <div class="row head"><span>Categoria</span><span>n</span><span>Constância</span><span>Dias</span></div>
      ${rows}
    </div>
    <p class="hint">Acima ${u.acima} · Abaixo ${u.abaixo} · Sem presença ${u.n_sem_presenca}</p>
  </article>`;
}

function tableFor(u, cat){
  const pros = u.professionals.filter(p => p.categoria === cat);
  const zeros = (u.sem_presenca_nomes || [])
    .filter(row => (Array.isArray(row) ? row[1] : null) === cat)
    .map(row => ({
      nome: Array.isArray(row) ? row[0] : row,
      categoria: cat,
      dias_trabalhados: 0,
      constancia_pct: 0,
      delta_indice: u.media_dias_trabalhados ? -100 : null,
      standing: 'abaixo',
      _zero: true,
    }));
  const all = pros.concat(zeros);
  const rows = all.map((p,i) => `<tr${p._zero?' style="opacity:.75"':''}>
    <td class="num">${i+1}</td>
    <td>${esc(p.nome)}${p._zero?' <span class="badge abaixo">0 dias</span>':''}</td>
    <td class="num">${p.dias_trabalhados}</td>
    <td class="num">${pct(p.constancia_pct)}</td>
    <td class="num">${delta(p.delta_indice)}</td>
    <td><span class="badge ${p.standing}">${p.standing}</span></td>
      </tr>`).join('');
  return `<div class="tablebox"><table>
    <thead><tr>
      <th class="num">#</th><th>Nome</th><th class="num">Dias</th><th class="num">Const%</th>
      <th class="num">Δ%</th><th>Standing</th>    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <p class="hint">${esc(u.unidade)} · ${cat} · com presença ${pros.length} · sem presença no período ${zeros.length} · média dos com presença ${pct(u.by_category[cat].media_constancia_pct)} · Δ vs média do recorte (${u.media_dias_trabalhados} dias)</p>`;
}

function spark(months, cls){
  const max = Math.max(...months.map(m => m.media_geral_constancia_pct));
  return `<div class="spark">${months.map(m => {
    const h = Math.max(6, Math.round((m.media_geral_constancia_pct / max) * 100));
    return `<div class="bar-wrap"><div class="bv">${pct(m.media_geral_constancia_pct)}</div><div class="bar ${cls}" style="height:${h}%"></div><div class="bl">${m.label}</div></div>`;
  }).join('')}</div>`;
}

function catPill(cat){
  const c = String(cat||'');
  const cls = c.startsWith('Cab') ? 'cab' : c.startsWith('Man') ? 'man' : c.startsWith('Maq') ? 'maq' : '';
  return `<span class="cat-pill ${cls}">${esc(c)}</span>`;
}

function monthProsTable(month){
  const pros = month.professionals || [];
  if (!pros.length) return '<p class="hint">Nenhum ativo neste mês.</p>';
  const rows = pros.map((p,i) => `<tr>
    <td class="num">${i+1}</td>
    <td>${esc(p.nome)}</td>
    <td>${catPill(p.categoria)}</td>
    <td class="num">${p.dias_trabalhados}</td>
    <td class="num">${p.dias_abertos_salao}</td>
    <td class="num">${pct(p.constancia_pct)}</td>
    <td class="num">${delta(p.delta_indice)}</td>
    <td><span class="badge ${p.standing}">${p.standing}</span></td>
  </tr>`).join('');
  return `<div class="tablebox"><table>
    <thead><tr>
      <th class="num">#</th><th>Nome</th><th>Cat</th>
      <th class="num">Dias</th><th class="num">Abertos</th><th class="num">Const%</th>
      <th class="num">Δ%</th><th>Standing</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function monthCard(label, cls, months, periodAvg){
  const first = months[0], last = months[months.length-1];
  const deltaPts = +(last.media_geral_constancia_pct - first.media_geral_constancia_pct).toFixed(1);
  const rows = months.map((m,i) => {
    const prev = i ? months[i-1].media_geral_constancia_pct : null;
    const up = prev != null && m.media_geral_constancia_pct > prev;
    const cab = m.by_category.Cabeleireiros;
    const man = m.by_category.Manicure;
    const maq = m.by_category.Maquiadora;
    return `<tr>
      <td><strong>${m.label}</strong></td>
      <td>${m.salon_open_days}</td>
      <td>${m.n_ativos}</td>
      <td class="${up?'up':''}">${pct(m.media_geral_constancia_pct)}</td>
      <td>${m.media_dias_trabalhados}</td>
      <td>${pct(cab.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${cab.n})</span></td>
      <td>${pct(man.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${man.n})</span></td>
      <td>${pct(maq.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${maq.n})</span></td>
    </tr>`;
  }).join('');
  const details = months.map(m => {
    const cab = m.by_category.Cabeleireiros?.n ?? 0;
    const man = m.by_category.Manicure?.n ?? 0;
    const maq = m.by_category.Maquiadora?.n ?? 0;
    return `<details>
      <summary>
        <span>${m.label}</span>
        <span class="meta">constância ${pct(m.media_geral_constancia_pct)}</span>
        <span class="meta">${m.n_ativos} ativos</span>
        <span class="meta">Cab ${cab} · Man ${man} · Maq ${maq}</span>
        <span class="meta">média ${m.media_dias_trabalhados} d · abertos ${m.salon_open_days}</span>
      </summary>
      ${monthProsTable(m)}
    </details>`;
  }).join('');
  return `<article class="card ${cls}">
    <h3>${esc(label)} <span class="tag">${first.label} ${pct(first.media_geral_constancia_pct)} → ${last.label} ${pct(last.media_geral_constancia_pct)} (${deltaPts>0?'+':''}${String(deltaPts).replace('.',',')} pp)</span></h3>
    ${spark(months, cls)}
    <div class="kpis">
      <div class="kpi"><div class="l">Jan → Set</div><div class="v gold">${pct(first.media_geral_constancia_pct)} → ${pct(last.media_geral_constancia_pct)}</div></div>
      <div class="kpi"><div class="l">Ativos no mês</div><div class="v">${first.n_ativos} → ${last.n_ativos}</div></div>
      <div class="kpi"><div class="l">Média período</div><div class="v">${pct(periodAvg)}</div></div>
    </div>
    <div style="overflow:auto">
      <table class="month-table">
        <thead><tr>
          <th>Mês</th><th>Abertos</th><th>Ativos</th><th>Const%</th><th>Dias méd.</th>
          <th>Cab</th><th>Man</th><th>Maq</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="hint">Ativo no mês = pelo menos 1 dia com visita. Constância = dias trabalhados ÷ dias abertos do mês. Sem faturamento neste painel.</p>
    <h4 style="margin:16px 0 8px;font:700 15px system-ui,sans-serif">Profissionais por mês</h4>
    <p class="hint" style="margin-top:0">Abra o mês para ver cada profissional ativo, constância e Δ vs a média dos ativos daquele mês.</p>
    <div class="month-pros">${details}</div>
  </article>`;
}


const slides = [
  {
    id: 'capa',
    label: 'Capa',
    html: `<section class="hero">
      <p class="eyebrow">Reunião · Presença de profissionais</p>
      <h1>Presença jan–set/2026</h1>
      <p class="lead">Recorte: <b>Cabeleireiros + Manicure + Maquiadora</b>. Assistentes fora. Constância = dias trabalhados ÷ dias abertos do salão.</p>
      <div class="big-row">
        <div class="big"><div class="u">Brasil</div><div class="n">${pct(br.media_geral_constancia_pct)}</div><div class="s">${br.n_com_presenca} profissionais · base ${br.salon_open_days} dias · média ${br.media_dias_trabalhados} dias</div></div>
        <div class="big"><div class="u">Iguatemi</div><div class="n">${pct(ig.media_geral_constancia_pct)}</div><div class="s">${ig.n_com_presenca} profissionais · base ${ig.salon_open_days} dias · média ${ig.media_dias_trabalhados} dias</div></div>
      </div>
    </section>`
  },
  {
    id: 'resumo',
    label: 'Resumo',
    html: `<h2>Resumo por unidade</h2>
      <p class="sub">Médias gerais e por categoria no recorte oficial da reunião.</p>
      <div class="cards">${unitBlock(br,'br')}${unitBlock(ig,'ig')}</div>`
  },
  {
    id: 'mes',
    label: 'Mês a mês',
    fullLabel: 'Mês a mês',
    html: `<h2>Mês a mês</h2>
      <p class="sub">Só quem teve presença no mês (ativos). Evolução da constância + lista de cada profissional por mês. Sem faturamento.</p>
      <div class="month-grid">
        ${monthCard('Brasil','br', mBr, br.media_geral_constancia_pct)}
        ${monthCard('Iguatemi','ig', mIg, ig.media_geral_constancia_pct)}
      </div>`
  }
];

[['brasil', br], ['iguatemi', ig]].forEach(([key, u]) => {
  CATS.forEach(cat => {
    slides.push({
      id: `${key}-${cat}`,
      label: `${u.unidade.slice(0,3)} ${cat.slice(0,3)}`,
      fullLabel: `${u.unidade} · ${cat}`,
      html: `<h2>${esc(u.unidade)} — ${cat}</h2>
        <p class="sub">Ordenado por constância. Verde = acima da média do recorte · Vermelho = abaixo.</p>
        ${tableFor(u, cat)}`
    });
  });
});

slides.push({
  id: 'opiniao',
  label: 'Opinião',
  fullLabel: 'Minha opinião',
  html: `<div class="opiniao">
    <p class="eyebrow" style="opacity:.7">Waltter · leitura da mesa</p>
    <h2>Minha opinião</h2>
    <p class="sub" style="margin-bottom:0">O que os números pedem na prática — sem maquiar o buraco nem celebrar média falsa.</p>
    <div class="points">
      <div class="point">
        <div class="num">1</div>
        <div>
          <h4>A curva está subindo — e isso é o ponto</h4>
          <p>Brasil saiu de <b>49,5%</b> em jan para <b>65,3%</b> em set (+15,8 pp). Iguatemi de <b>41,6%</b> para <b>78,2%</b> (+36,6 pp). A média do período (BR 50,2% / IG 53,3%) ainda parece baixa porque carrega o começo do ano e quem entrou/saiu. Olhando mês a mês — e a lista de ativos de cada mês — o time que está presente hoje aparece bem mais consistente.</p>
        </div>
      </div>
      <div class="point">
        <div class="num">2</div>
        <div>
          <h4>Abril foi o solavanco — não o padrão</h4>
          <p>Nas duas unidades abril cai (BR 49,4% · IG 42,1%). Depois o ritmo recupera. Não tratar abril como “é assim o ano”; tratar como alerta de calendário/operacional que já se corrigiu em junho–setembro.</p>
        </div>
      </div>
      <div class="point">
        <div class="num">3</div>
        <div>
          <h4>Manicure puxa constância; Cabeleireiro ainda tem folga</h4>
          <p>Em set, Manicure está em <b>84,4%</b> (BR) e <b>90,9%</b> (IG). Cabeleireiros em <b>59,4%</b> / <b>68,3%</b>. O gap não é “falta de gente no elenco” — é presença desigual dentro do mesmo salão. É aqui que gestão de escala e cobrança diária mudam o índice.</p>
        </div>
      </div>
      <div class="point">
        <div class="num">4</div>
        <div>
          <h4>Mais ativos no mês ≠ diluir o padrão</h4>
          <p>Brasil passou de 46 para 63 ativos no mês; Iguatemi de 51 para 58 e ainda assim a constância média subiu. Ou seja: dá para crescer o elenco ativo sem derrubar presença — desde que entrada nova entre já com ritmo, não só com cadastro.</p>
        </div>
      </div>
      <div class="point">
        <div class="num">5</div>
        <div>
          <h4>O trabalho agora é o miolo, não a média</h4>
          <p>Quem está abaixo da média do recorte (26 no BR, 24 no IG no acumulado) é a fila de conversa — use as listas mês a mês para ver quem caiu ou sumiu. Top da lista já entrega presença. Assistente fora do recorte de propósito: o jogo da reunião é Cab + Man + Maq.</p>
        </div>
      </div>
    </div>
    <div class="callout">
      <b>Fechamento:</b> o ano começou frouxo e fechou set com constância de salão bem mais saudável nas duas unidades. Próximo passo não é “melhorar a média” no abstrato — é travar o patamar de ago/set e puxar cabeleireiro para perto do que manicure já entrega.
    </div>
  </div>`
});

const deck = document.getElementById('deck');
const nav = document.getElementById('nav');
deck.innerHTML = slides.map((s,i) => `<section class="slide ${i===0?'active':''}" data-i="${i}">${s.html}</section>`).join('');
nav.innerHTML = slides.map((s,i) => `<button data-i="${i}" class="${i===0?'active':''}">${s.fullLabel || s.label}</button>`).join('');

let idx = 0;
function go(i){
  idx = Math.max(0, Math.min(slides.length-1, i));
  document.querySelectorAll('.slide').forEach((el,j) => el.classList.toggle('active', j===idx));
  document.querySelectorAll('#nav button').forEach((el,j) => el.classList.toggle('active', j===idx));
}
function next(){ go(idx+1); }
function prev(){ go(idx-1); }
nav.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b) go(+b.dataset.i);
});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});

// expose for topbar onclick
window.next = next;
window.prev = prev;
window.go = go;

})().catch(err => {
  const deck = document.getElementById('deck');
  if (deck) deck.innerHTML = '<p style="padding:24px;font:500 14px system-ui">Falha ao carregar dados: '+String(err)+'</p>';
  console.error(err);
});
</script>
</body>
</html>
