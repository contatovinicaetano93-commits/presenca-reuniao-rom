<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presença jan–set/2026 · Reunião</title>
<style>
  :root {
    --ink: #101820;
    --muted: #667787;
    --line: #e4e0d8;
    --bg: #efece6;
    --paper: #fffcf7;
    --br: #0b6b57;
    --ig: #1a3d66;
    --up: #157a45;
    --upbg: #dff5e8;
    --down: #b13a3a;
    --downbg: #fdeaea;
    --gold: #c96b2c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(16,24,32,.92);
    color: #fff;
    backdrop-filter: blur(8px);
  }
  .topbar .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .nav button, .tool button {
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.08);
    color: #fff;
    border-radius: 999px;
    padding: 7px 12px;
    font: 600 12px/1 system-ui, sans-serif;
    cursor: pointer;
  }
  .nav button.active { background: #fff; color: var(--ink); }
  .tool { display: flex; gap: 6px; }
  main { flex: 1; padding: 18px 18px 40px; max-width: 1200px; width: 100%; margin: 0 auto; }

  .slide { display: none; animation: in .25s ease; }
  .slide.active { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }

  .hero {
    background: linear-gradient(145deg, #102030, #0b6b57 55%, #1a3d66);
    color: #fff;
    border-radius: 24px;
    padding: clamp(22px, 4vw, 40px);
    min-height: 70vh;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow { font: 600 12px/1.2 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .7; margin: 0 0 14px; }
  h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; margin: 0 0 12px; font-weight: 700; }
  .lead { font-size: clamp(1rem, 2vw, 1.25rem); max-width: 36em; opacity: .92; margin: 0 0 28px; }
  .big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .big {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;
    padding: 18px 20px;
  }
  .big .u { font: 700 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .big .n { font-size: clamp(2.6rem, 7vw, 4.5rem); font-weight: 700; line-height: 1; margin: 8px 0; }
  .big .s { font: 500 14px/1.35 system-ui, sans-serif; opacity: .85; }

  h2 {
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    margin: 0 0 8px;
  }
  .sub { margin: 0 0 18px; color: var(--muted); font: 500 15px/1.4 system-ui, sans-serif; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
  }
  .card.br { border-top: 5px solid var(--br); }
  .card.ig { border-top: 5px solid var(--ig); }
  .card h3 { margin: 0 0 12px; font-size: 1.3rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .tag { font: 700 11px system-ui, sans-serif; padding: 4px 9px; border-radius: 999px; background: #ece7dc; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #f5f1e8; border-radius: 12px; padding: 10px; }
  .kpi .l { font: 600 10px system-ui, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .kpi .v { font-size: 1.6rem; font-weight: 700; margin-top: 2px; }
  .kpi .v.gold { color: var(--gold); }
  .rows { display: grid; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 1.3fr .7fr .8fr .8fr;
    gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 10px; background: #f7f3ea;
    font: 500 13px/1.2 system-ui, sans-serif;
  }
  .row.head { background: transparent; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filters button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 8px 12px; font: 650 12px system-ui, sans-serif; cursor: pointer;
  }
  .filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .tablebox {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: auto;
    max-height: calc(100vh - 220px);
  }
  table { width: 100%; border-collapse: collapse; font: 500 13px/1.25 system-ui, sans-serif; min-width: 700px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eee7da; text-align: left; }
  th { position: sticky; top: 0; background: #152433; color: #fff; z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:nth-child(even) td { background: #fbf8f1; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font: 700 11px system-ui, sans-serif; }
  .badge.acima { background: var(--upbg); color: var(--up); }
  .badge.abaixo { background: var(--downbg); color: var(--down); }

  .hint {
    margin-top: 12px; color: var(--muted);
    font: 500 12px/1.4 system-ui, sans-serif;
  }

  @media (max-width: 800px) {
    .big-row, .cards, .kpis { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr 1fr; }
  }
  @media print {
    .topbar { display: none; }
    .slide { display: block !important; page-break-after: always; }
    .tablebox { max-height: none; overflow: visible; }
    body { background: #fff; }
  }

  .month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .spark {
    display: flex; align-items: flex-end; gap: 6px;
    height: 120px; margin: 8px 0 14px; padding: 0 2px;
  }
  .spark .bar-wrap {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%;
    justify-content: flex-end;
  }
  .spark .bar {
    width: 100%; border-radius: 6px 6px 2px 2px; min-height: 4px;
    background: linear-gradient(180deg, #2a9d7a, #0b6b57);
  }
  .spark .bar.ig { background: linear-gradient(180deg, #3a6ea5, #1a3d66); }
  .spark .bl { font: 700 10px system-ui, sans-serif; color: var(--muted); }
  .spark .bv { font: 700 11px system-ui, sans-serif; }
  .month-table { width: 100%; border-collapse: collapse; font: 500 13px/1.25 system-ui, sans-serif; }
  .month-table th, .month-table td { padding: 8px 10px; border-bottom: 1px solid #eee7da; text-align: right; }
  .month-table th:first-child, .month-table td:first-child { text-align: left; }
  .month-table th { background: #f5f1e8; color: var(--muted); font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; }
  .month-table td.up { color: var(--up); font-weight: 700; }
  .opiniao {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(18px, 3vw, 28px);
  }
  .opiniao h2 { margin-bottom: 4px; }
  .opiniao .points { display: grid; gap: 14px; margin-top: 18px; }
  .opiniao .point {
    display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start;
    padding: 14px 16px; border-radius: 14px; background: #f7f3ea;
  }
  .opiniao .num {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font: 700 16px Georgia, serif; color: #fff;
    background: linear-gradient(145deg, #0b6b57, #1a3d66);
  }
  .opiniao .point h4 { margin: 0 0 4px; font: 700 15px/1.25 system-ui, sans-serif; }
  .opiniao .point p { margin: 0; color: #3a4654; font: 500 14px/1.45 system-ui, sans-serif; }
  .callout {
    margin-top: 18px; padding: 16px 18px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(11,107,87,.1), rgba(26,61,102,.1));
    border-left: 4px solid var(--br);
    font: 500 15px/1.45 system-ui, sans-serif;
  }

  .month-pros { margin-top: 16px; display: grid; gap: 12px; }
  .month-pros details {
    background: #f7f3ea; border: 1px solid var(--line); border-radius: 14px; padding: 0;
  }
  .month-pros summary {
    cursor: pointer; list-style: none; padding: 12px 14px;
    font: 700 13px/1.3 system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  }
  .month-pros summary::-webkit-details-marker { display: none; }
  .month-pros summary::before {
    content: "▸"; color: var(--muted); margin-right: 4px;
  }
  .month-pros details[open] summary::before { content: "▾"; }
  .month-pros .meta { font: 600 12px system-ui, sans-serif; color: var(--muted); }
  .month-pros .tablebox { max-height: 320px; border: none; border-radius: 0 0 14px 14px; }
  .month-pros table { min-width: 560px; }
  .cat-pill {
    font: 700 10px system-ui, sans-serif; padding: 2px 7px; border-radius: 999px;
    background: #ece7dc; color: var(--ink);
  }
  .cat-pill.cab { background: #dceee8; }
  .cat-pill.man { background: #e8e4f5; }
  .cat-pill.maq { background: #f5e8dc; }
  @media (max-width: 800px) {
    .month-grid { grid-template-columns: 1fr; }
  }

  .search-panel { max-width: 820px; }
  .search-box { position: relative; margin-bottom: 16px; }
  .search-box input {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 14px;
    padding: 14px 16px;
    font: 500 16px/1.2 system-ui, sans-serif;
    color: var(--ink);
  }
  .search-box input:focus {
    outline: 2px solid rgba(11,107,87,.35);
    border-color: var(--br);
  }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    margin: 0; padding: 6px; list-style: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 28px rgba(16,24,32,.12);
    max-height: 280px; overflow: auto;
    z-index: 5;
  }
  .suggest li {
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    font: 500 14px/1.3 system-ui, sans-serif;
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
  }
  .suggest li:hover, .suggest li.active { background: #f5f1e8; }
  .suggest .meta { font: 600 11px system-ui, sans-serif; color: var(--muted); }
  .search-empty {
    padding: 28px 18px; text-align: center; color: var(--muted);
    background: var(--paper); border: 1px dashed var(--line); border-radius: 18px;
    font: 500 14px/1.4 system-ui, sans-serif;
  }
  .pro-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
  }
  .pro-card.br { border-top: 5px solid var(--br); }
  .pro-card.ig { border-top: 5px solid var(--ig); }
  .pro-card h3 {
    margin: 0 0 4px; font-size: clamp(1.25rem, 2.5vw, 1.7rem);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .pro-card .who {
    margin: 0 0 14px; color: var(--muted);
    font: 500 14px/1.35 system-ui, sans-serif;
  }
  .pro-series { margin-top: 8px; overflow: auto; }
  .pro-series .month-table td.mute { color: var(--muted); }

  .app[hidden], #login-gate[hidden] { display: none !important; }
  #login-gate {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(11,107,87,.18), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(26,61,102,.16), transparent 50%),
      var(--bg);
  }
  .login-card {
    width: min(420px, 100%);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 24px;
    box-shadow: 0 18px 40px rgba(16,24,32,.08);
  }
  .login-card h1 {
    margin: 0 0 6px;
    font-size: clamp(1.6rem, 4vw, 2rem);
  }
  .login-card .sub { margin-bottom: 18px; }
  .login-card label {
    display: block;
    font: 700 11px system-ui, sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .login-card .field { margin-bottom: 12px; }
  .login-card input {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    font: 500 15px/1.2 system-ui, sans-serif;
    color: var(--ink);
  }
  .login-card input:focus {
    outline: 2px solid rgba(11,107,87,.35);
    border-color: var(--br);
  }
  .login-card button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    border: 0;
    border-radius: 12px;
    padding: 12px 14px;
    background: linear-gradient(145deg, #0b6b57, #1a3d66);
    color: #fff;
    font: 700 14px system-ui, sans-serif;
    cursor: pointer;
  }
  .login-card button[type="submit"][disabled] { opacity: .65; cursor: wait; }
  .login-error {
    display: none;
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--downbg);
    color: var(--down);
    font: 600 13px/1.35 system-ui, sans-serif;
  }
  .login-error.show { display: block; }
  .userchip {
    font: 600 11px system-ui, sans-serif;
    opacity: .85;
    max-width: 180px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

</style>
</head>
<body>
<section id="login-gate" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <p class="eyebrow" style="margin:0 0 8px;opacity:.7">ROM · acesso autorizado</p>
    <h1>Entrar</h1>
    <p class="sub">Use o e-mail corporativo da sua unidade para ver apenas os dados liberados.</p>
    <p class="login-error" id="login-error" role="alert"></p>
    <div class="field">
      <label for="login-email">E-mail</label>
      <input id="login-email" name="email" type="email" required autocomplete="username" placeholder="seu@email.com" />
    </div>
    <div class="field">
      <label for="login-password">Senha</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button type="submit" id="login-submit">Entrar</button>
  </form>
</section>

<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="brand">ROM · Presença Jan–Set/2026</div>
    <div class="nav" id="nav"></div>
    <div class="tool">
      <span class="userchip" id="userchip"></span>
      <button type="button" onclick="prev()">←</button>
      <button type="button" onclick="next()">→</button>
      <button type="button" onclick="window.print()">PDF</button>
      <button type="button" id="logout-btn">Sair</button>
    </div>
  </div>
  <main id="deck"></main>
</div>

<script>
(async () => {
const CATS = ['Cabeleireiros','Manicure','Maquiadora'];
const loginGate = document.getElementById('login-gate');
const app = document.getElementById('app');
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const loginSubmit = document.getElementById('login-submit');

function showLogin(msg){
  app.hidden = true;
  loginGate.hidden = false;
  if (msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
  } else {
    loginError.textContent = '';
    loginError.classList.remove('show');
  }
}

async function api(path, opts = {}){
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  let body = null;
  try { body = await res.json(); } catch { body = null; }
  return { res, body };
}

async function ensureSession(){
  const { res, body } = await api('/api/me');
  if (!res.ok) return null;
  return body.user;
}

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  loginSubmit.disabled = true;
  loginError.classList.remove('show');
  try {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const { res, body } = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) {
      showLogin((body && body.error) || 'Falha no login');
      return;
    }
    await boot(body.user);
  } catch (err) {
    showLogin('Não foi possível autenticar. Tente de novo.');
    console.error(err);
  } finally {
    loginSubmit.disabled = false;
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await api('/api/logout', { method: 'POST', body: '{}' });
  location.reload();
});

async function boot(sessionUser){
  const { res, body: DATA } = await api('/api/data');
  if (!res.ok) {
    showLogin((DATA && DATA.error) || 'Sessão expirada. Entre novamente.');
    return;
  }

  loginGate.hidden = true;
  app.hidden = false;

  const USER = DATA.user || sessionUser;
  const br = DATA.unidades.brasil || null;
  const ig = DATA.unidades.iguatemi || null;
  const mBr = DATA.monthly.brasil || [];
  const mIg = DATA.monthly.iguatemi || [];
  const accessUnit = USER.unit; // brasil | iguatemi | ambas
  const canBrasil = accessUnit === 'ambas' || accessUnit === 'brasil';
  const canIguatemi = accessUnit === 'ambas' || accessUnit === 'iguatemi';
  const isDiretor = accessUnit === 'ambas';

  document.getElementById('userchip').textContent =
    `${USER.name || USER.email} · ${accessUnit === 'ambas' ? 'Diretor' : (accessUnit === 'brasil' ? 'Brasil' : 'Iguatemi')}`;

const money = n => n == null ? '—' : Number(n).toLocaleString('pt-BR', {maximumFractionDigits:0});
const pct = n => n == null ? '—' : String(n).replace('.', ',') + '%';
const delta = n => n == null ? '—' : ((n>0?'+':'') + Number(n).toFixed(1).replace('.', ','));
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function unitBlock(u, cls){
  const rows = CATS.map(c => {
    const b = u.by_category[c];
    return `<div class="row"><strong>${c}</strong><span>${b.n}</span><span>${pct(b.media_constancia_pct)}</span><span>${b.media_dias_trabalhados} d</span></div>`;
  }).join('');
  return `<article class="card ${cls}">
    <h3>${esc(u.unidade)} <span class="tag">${u.salon_open_days} dias abertos</span></h3>
    <div class="kpis">
      <div class="kpi"><div class="l">Constância</div><div class="v gold">${pct(u.media_geral_constancia_pct)}</div></div>
      <div class="kpi"><div class="l">Média dias</div><div class="v">${u.media_dias_trabalhados}</div></div>
      <div class="kpi"><div class="l">Com presença</div><div class="v">${u.n_com_presenca}</div></div>
    </div>
    <div class="rows">
      <div class="row head"><span>Categoria</span><span>n</span><span>Constância</span><span>Dias</span></div>
      ${rows}
    </div>
    <p class="hint">Acima ${u.acima} · Abaixo ${u.abaixo} · Sem presença ${u.n_sem_presenca}</p>
  </article>`;
}

function tableFor(u, cat){
  const pros = u.professionals.filter(p => p.categoria === cat);
  const zeros = (u.sem_presenca_nomes || [])
    .filter(row => (Array.isArray(row) ? row[1] : null) === cat)
    .map(row => ({
      nome: Array.isArray(row) ? row[0] : row,
      categoria: cat,
      dias_trabalhados: 0,
      constancia_pct: 0,
      delta_indice: u.media_dias_trabalhados ? -100 : null,
      standing: 'abaixo',
      _zero: true,
    }));
  const all = pros.concat(zeros);
  const rows = all.map((p,i) => `<tr${p._zero?' style="opacity:.75"':''}>
    <td class="num">${i+1}</td>
    <td>${esc(p.nome)}${p._zero?' <span class="badge abaixo">0 dias</span>':''}</td>
    <td class="num">${p.dias_trabalhados}</td>
    <td class="num">${pct(p.constancia_pct)}</td>
    <td class="num">${delta(p.delta_indice)}</td>
    <td><span class="badge ${p.standing}">${p.standing}</span></td>
      </tr>`).join('');
  return `<div class="tablebox"><table>
    <thead><tr>
      <th class="num">#</th><th>Nome</th><th class="num">Dias</th><th class="num">Const%</th>
      <th class="num">Δ%</th><th>Standing</th>    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>
  <p class="hint">${esc(u.unidade)} · ${cat} · com presença ${pros.length} · sem presença no período ${zeros.length} · média dos com presença ${pct(u.by_category[cat].media_constancia_pct)} · Δ vs média do recorte (${u.media_dias_trabalhados} dias)</p>`;
}

function spark(months, cls){
  const max = Math.max(...months.map(m => m.media_geral_constancia_pct));
  return `<div class="spark">${months.map(m => {
    const h = Math.max(6, Math.round((m.media_geral_constancia_pct / max) * 100));
    return `<div class="bar-wrap"><div class="bv">${pct(m.media_geral_constancia_pct)}</div><div class="bar ${cls}" style="height:${h}%"></div><div class="bl">${m.label}</div></div>`;
  }).join('')}</div>`;
}

function catPill(cat){
  const c = String(cat||'');
  const cls = c.startsWith('Cab') ? 'cab' : c.startsWith('Man') ? 'man' : c.startsWith('Maq') ? 'maq' : '';
  return `<span class="cat-pill ${cls}">${esc(c)}</span>`;
}

function monthProsTable(month){
  const pros = month.professionals || [];
  if (!pros.length) return '<p class="hint">Nenhum ativo neste mês.</p>';
  const rows = pros.map((p,i) => `<tr>
    <td class="num">${i+1}</td>
    <td>${esc(p.nome)}</td>
    <td>${catPill(p.categoria)}</td>
    <td class="num">${p.dias_trabalhados}</td>
    <td class="num">${p.dias_abertos_salao}</td>
    <td class="num">${pct(p.constancia_pct)}</td>
    <td class="num">${delta(p.delta_indice)}</td>
    <td><span class="badge ${p.standing}">${p.standing}</span></td>
  </tr>`).join('');
  return `<div class="tablebox"><table>
    <thead><tr>
      <th class="num">#</th><th>Nome</th><th>Cat</th>
      <th class="num">Dias</th><th class="num">Abertos</th><th class="num">Const%</th>
      <th class="num">Δ%</th><th>Standing</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function monthCard(label, cls, months, periodAvg){
  const first = months[0], last = months[months.length-1];
  const deltaPts = +(last.media_geral_constancia_pct - first.media_geral_constancia_pct).toFixed(1);
  const rows = months.map((m,i) => {
    const prev = i ? months[i-1].media_geral_constancia_pct : null;
    const up = prev != null && m.media_geral_constancia_pct > prev;
    const cab = m.by_category.Cabeleireiros;
    const man = m.by_category.Manicure;
    const maq = m.by_category.Maquiadora;
    return `<tr>
      <td><strong>${m.label}</strong></td>
      <td>${m.salon_open_days}</td>
      <td>${m.n_ativos}</td>
      <td class="${up?'up':''}">${pct(m.media_geral_constancia_pct)}</td>
      <td>${m.media_dias_trabalhados}</td>
      <td>${pct(cab.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${cab.n})</span></td>
      <td>${pct(man.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${man.n})</span></td>
      <td>${pct(maq.media_constancia_pct)} <span style="color:var(--muted);font-size:11px">(n=${maq.n})</span></td>
    </tr>`;
  }).join('');
  const details = months.map(m => {
    const cab = m.by_category.Cabeleireiros?.n ?? 0;
    const man = m.by_category.Manicure?.n ?? 0;
    const maq = m.by_category.Maquiadora?.n ?? 0;
    return `<details>
      <summary>
        <span>${m.label}</span>
        <span class="meta">constância ${pct(m.media_geral_constancia_pct)}</span>
        <span class="meta">${m.n_ativos} ativos</span>
        <span class="meta">Cab ${cab} · Man ${man} · Maq ${maq}</span>
        <span class="meta">média ${m.media_dias_trabalhados} d · abertos ${m.salon_open_days}</span>
      </summary>
      ${monthProsTable(m)}
    </details>`;
  }).join('');
  return `<article class="card ${cls}">
    <h3>${esc(label)} <span class="tag">${first.label} ${pct(first.media_geral_constancia_pct)} → ${last.label} ${pct(last.media_geral_constancia_pct)} (${deltaPts>0?'+':''}${String(deltaPts).replace('.',',')} pp)</span></h3>
    ${spark(months, cls)}
    <div class="kpis">
      <div class="kpi"><div class="l">Jan → Set</div><div class="v gold">${pct(first.media_geral_constancia_pct)} → ${pct(last.media_geral_constancia_pct)}</div></div>
      <div class="kpi"><div class="l">Ativos no mês</div><div class="v">${first.n_ativos} → ${last.n_ativos}</div></div>
      <div class="kpi"><div class="l">Média período</div><div class="v">${pct(periodAvg)}</div></div>
    </div>
    <div style="overflow:auto">
      <table class="month-table">
        <thead><tr>
          <th>Mês</th><th>Abertos</th><th>Ativos</th><th>Const%</th><th>Dias méd.</th>
          <th>Cab</th><th>Man</th><th>Maq</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="hint">Ativo no mês = pelo menos 1 dia com visita. Constância = dias trabalhados ÷ dias abertos do mês. Sem faturamento neste painel.</p>
    <h4 style="margin:16px 0 8px;font:700 15px system-ui,sans-serif">Profissionais por mês</h4>
    <p class="hint" style="margin-top:0">Abra o mês para ver cada profissional ativo, constância e Δ vs a média dos ativos daquele mês.</p>
    <div class="month-pros">${details}</div>
  </article>`;
}

function go(i){

  document.querySelectorAll('#nav button').forEach((el,j) => el.classList.toggle('active', j===idx));
}
function next(){ go(idx+1); }
function prev(){ go(idx-1); }

  if (b) go(+b.dataset.i);
});
window.addEventListener('keydown', e => {
  const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  if (typing) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});

function fold(s){
  return String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim().replace(/\s+/g, ' ');
}

function buildProIndex(){
  const units = [];
  if (canBrasil && br) units.push(['brasil', br, mBr]);
  if (canIguatemi && ig) units.push(['iguatemi', ig, mIg]);
  const list = [];
  for (const [key, u, months] of units){
    const byName = new Map();
    for (const p of u.professionals){
      byName.set(p.nome, {
        ...p,
        unidade: u.unidade,
        unitKey: key,
        mediaUnidade: u.media_geral_constancia_pct,
        mediaDiasUnidade: u.media_dias_trabalhados,
        zero: false,
      });
    }
    for (const row of (u.sem_presenca_nomes || [])){
      const nome = Array.isArray(row) ? row[0] : row;
      const cat = Array.isArray(row) ? row[1] : null;
      if (!byName.has(nome)){
        byName.set(nome, {
          nome,
          categoria: cat,
          dias_trabalhados: 0,
          dias_abertos_salao: u.salon_open_days,
          constancia_pct: 0,
          delta_indice: u.media_dias_trabalhados ? -100 : null,
          standing: 'abaixo',
          unidade: u.unidade,
          unitKey: key,
          mediaUnidade: u.media_geral_constancia_pct,
          mediaDiasUnidade: u.media_dias_trabalhados,
          zero: true,
        });
      }
    }
    for (const p of byName.values()){
      const series = months.map(m => {
        const hit = (m.professionals || []).find(x => x.nome === p.nome);
        if (hit){
          return {
            label: m.label,
            month: m.month,
            ativo: true,
            dias_trabalhados: hit.dias_trabalhados,
            dias_abertos_salao: hit.dias_abertos_salao,
            constancia_pct: hit.constancia_pct,
            delta_indice: hit.delta_indice,
            standing: hit.standing,
          };
        }
        return {
          label: m.label,
          month: m.month,
          ativo: false,
          dias_trabalhados: 0,
          dias_abertos_salao: m.salon_open_days,
          constancia_pct: null,
          delta_indice: null,
          standing: null,
        };
      });
      list.push({ ...p, series, fold: fold(p.nome) });
    }
  }
  return list.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}

function wireSearch(){
  const unitBar = document.getElementById('search-unit');
  const input = document.getElementById('search-q');
  const suggest = document.getElementById('search-suggest');
  const result = document.getElementById('search-result');
  if (!unitBar || !input || !suggest || !result) return;

  let unit = canBrasil ? 'brasil' : 'iguatemi';
  let activeIdx = -1;
  let matches = [];

  const emptyMsg = () => {
    result.innerHTML = '<div class="search-empty">Busque um profissional para ver constância do período e a curva mês a mês.</div>';
  };

  function filtered(){
    const q = fold(input.value);
    if (!q) return [];
    const pool = PRO_INDEX.filter(p => unit === 'ambas' || p.unitKey === unit);
    return pool.filter(p => p.fold.includes(q)).slice(0, 20);
  }

  function paintSuggest(){
    matches = filtered();
    activeIdx = matches.length ? 0 : -1;
    if (!input.value.trim()){
      suggest.hidden = true;
      suggest.innerHTML = '';
      return;
    }
    if (!matches.length){
      suggest.hidden = false;
      suggest.innerHTML = '<li class="meta" style="cursor:default">Nenhum profissional encontrado nesta unidade</li>';
      return;
    }
    suggest.hidden = false;
    suggest.innerHTML = matches.map((p,i) => `<li data-i="${i}" class="${i===activeIdx?'active':''}">
      <strong>${esc(p.nome)}</strong>
      <span class="meta">${esc(p.unidade)}</span>
      ${catPill(p.categoria)}
      <span class="meta">${pct(p.constancia_pct)}</span>
    </li>`).join('');
  }

  function selectPro(p){
    if (!p) return;
    input.value = p.nome;
    suggest.hidden = true;
    suggest.innerHTML = '';
    activeIdx = -1;
    if (unit === 'ambas'){
      const same = PRO_INDEX.filter(x => x.nome === p.nome);
      result.innerHTML = same.map(renderProCard).join('<div style="height:12px"></div>');
    } else {
      result.innerHTML = renderProCard(p);
    }
  }

  unitBar.addEventListener('click', e => {
    const b = e.target.closest('button[data-unit]');
    if (!b) return;
    unit = b.dataset.unit;
    unitBar.querySelectorAll('button').forEach(el => el.classList.toggle('active', el === b));
    input.value = '';
    matches = [];
    activeIdx = -1;
    suggest.hidden = true;
    suggest.innerHTML = '';
    emptyMsg();
    input.focus();
  });

  input.addEventListener('input', paintSuggest);
  input.addEventListener('focus', () => { if (input.value.trim()) paintSuggest(); });

  suggest.addEventListener('mousedown', e => {
    const li = e.target.closest('li[data-i]');
    if (!li) return;
    e.preventDefault();
    selectPro(matches[+li.dataset.i]);
  });

  input.addEventListener('keydown', e => {
    if (suggest.hidden && e.key !== 'Enter') return;
    if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (!matches.length) return;
      activeIdx = (activeIdx + 1) % matches.length;
      suggest.querySelectorAll('li[data-i]').forEach((el,i) => el.classList.toggle('active', i===activeIdx));
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (!matches.length) return;
      activeIdx = (activeIdx - 1 + matches.length) % matches.length;
      suggest.querySelectorAll('li[data-i]').forEach((el,i) => el.classList.toggle('active', i===activeIdx));
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (activeIdx >= 0 && matches[activeIdx]) selectPro(matches[activeIdx]);
    } else if (e.key === 'Escape'){
      suggest.hidden = true;
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-box')) suggest.hidden = true;
  });
}

wireSearch();

// expose for topbar onclick
window.next = next;
window.prev = prev;
window.go = go;
} // end boot

const existing = await ensureSession();
if (existing) await boot(existing);
else showLogin();

})().catch(err => {
  showLogin('Falha ao iniciar o painel.');
  console.error(err);
});
</script>
</body>
</html>
